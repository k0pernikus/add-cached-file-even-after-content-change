name: repro

on:
  push:
  workflow_dispatch:

env:
  ALPHA_SHA256: 1921b918b15842c7fdb115078e610263fac85f159c1d8e0ecec3d89a0faa4005
  BRAVO_SHA256: 8a51c1b8853b568b5ca25570ef461d6f5a8896f64a952364ed61be1a1e99eb00
  UNSEEN_SHA256: 380ff93584f22d53e11cc442f8207c014465f4d6a66a0ddbdb16d5e7e06559a2

jobs:
  add-checksum-ignores-the-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report the digest of each file as committed
        run: sha256sum folder_1/same_file folder_2/same_file

      - name: Serve both files over HTTP
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 --directory . &
          timeout 10 bash -c 'until curl --silent --fail --head http://127.0.0.1:8099/folder_1/same_file; do sleep 0.2; done'

      - name: Build 1 — folder_1 with folder_1's digest, populating the cache
        run: |
          docker build \
            --build-arg SRC_URL=http://127.0.0.1:8099/folder_1/same_file \
            --build-arg SRC_SHA256="$ALPHA_SHA256" \
            --output type=local,dest=out_1 .

      - name: Build 1 produced folder_1's content
        run: diff folder_1/same_file out_1/payload

      - name: Build 2 — folder_2 with folder_1's stale digest
        run: |
          docker build \
            --build-arg SRC_URL=http://127.0.0.1:8099/folder_2/same_file \
            --build-arg SRC_SHA256="$ALPHA_SHA256" \
            --output type=local,dest=out_2 .

      - name: Build 2 should invalidate the cache and get file content BRAVO
        run: diff folder_2/same_file out_2/payload

      - name: Control — that URL does serve different bytes
        if: always()
        run: |
          docker build \
            --build-arg SRC_URL=http://127.0.0.1:8099/folder_2/same_file \
            --build-arg SRC_SHA256="$BRAVO_SHA256" \
            --output type=local,dest=out_3 .
          diff folder_2/same_file out_3/payload

      - name: Control — a digest with no cache entry is fetched and fails
        if: always()
        run: |
          if docker build \
              --build-arg SRC_URL=http://127.0.0.1:8099/folder_2/same_file \
              --build-arg SRC_SHA256="$UNSEEN_SHA256" \
              --output type=local,dest=out_unseen . ; then
            printf 'build succeeded with a digest that matches no served file\n' >&2
            exit 1
          fi

      - name: Control — --no-cache does not bypass the source cache
        if: always()
        run: |
          docker build --no-cache \
            --build-arg SRC_URL=http://127.0.0.1:8099/folder_2/same_file \
            --build-arg SRC_SHA256="$ALPHA_SHA256" \
            --output type=local,dest=out_nocache .
          diff folder_1/same_file out_nocache/payload
